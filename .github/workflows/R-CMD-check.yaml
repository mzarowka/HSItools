# R CMD check across the standard r-lib matrix.
# Adapted from r-lib/actions check-standard for HSItools:
# - Quarto setup added (vignettes are .qmd)
# - triggers on both main and dev (public repo: Actions minutes are free)
# - _R_CHECK_FORCE_SUGGESTS_ disabled (Suggests packages are guarded by
#   skip helpers in tests; check must not fail on their absence)
#
# Location in repo: .github/workflows/R-CMD-check.yaml
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The Windows runner image ships a preinstalled system R, and quarto
      # discovers R via the Windows Registry -- finding that bare install
      # instead of the setup-r one. The vignette subprocess then has an empty
      # library ("there is no package called 'HSItools'"). QUARTO_R is
      # quarto's documented override; point it at the R actually running the
      # check. macOS/Linux are unaffected (quarto finds R via PATH there).
      - name: Point quarto at the setup-r R installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rbin = Split-Path (Get-Command Rscript.exe).Source
          echo "QUARTO_R=$rbin" >> $env:GITHUB_ENV

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
          # Windows: runner temp (D:\a\_temp) is on the same drive as the
          # checkout (D:\a\...). Quarto's path handling breaks across drive
          # letters, so the vignette-render subprocess loses the temp package
          # library if temp stays on C:. Same bug as the local TMPDIR=C:/rtemp
          # fix, mirrored. No-op on macOS/Linux.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'